name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build RepoTransit.sln -c Release
      - name: Check behavior
        run: dotnet run --project tests/RepoTransit.Tests/RepoTransit.Tests.csproj -c Release --no-build
      - name: Package Windows client
        shell: pwsh
        run: |
          dotnet publish src/RepoTransit/RepoTransit.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
          Compress-Archive -Path publish/* -DestinationPath RepoTransit-win-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: RepoTransit-win-x64
          path: RepoTransit-win-x64.zip
