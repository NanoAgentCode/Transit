name: Windows installer

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '安装包版本，格式 x.y.z'
        required: true
        default: '0.1.0'

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    env:
      INSTALLER_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build and check behavior
        shell: pwsh
        run: |
          dotnet build RepoTransit.sln -c Release
          dotnet run --project tests/RepoTransit.Tests/RepoTransit.Tests.csproj -c Release --no-build
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw 'Inno Setup 安装文件校验失败。'
          }
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER') -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Inno Setup 安装失败：$($process.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:INSTALLER_VERSION.TrimStart('v')
          ./scripts/build-installer.ps1 -Version $version
      - uses: actions/upload-artifact@v7
        with:
          name: RepoTransit-installer
          path: |
            artifacts/installer/*-setup.exe
            artifacts/installer/*-setup.exe.sha256
